services:
  postgres:
    image: postgres:16-alpine
    container_name: stockwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockwatch_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-stockwatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stockwatch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockwatch} -d ${POSTGRES_DB:-stockwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: stockwatch-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - stockwatch-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    image: stockwatch-backend:local
    container_name: stockwatch-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockwatch}:${POSTGRES_PASSWORD:-stockwatch_secure_password}@postgres:5432/${POSTGRES_DB:-stockwatch}?schema=public
      # Local stack has no migration step; let the backend create the schema (never in production).
      DB_BOOTSTRAP_SCHEMA: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stockwatch-network

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    image: stockwatch-worker:local
    container_name: stockwatch-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockwatch}:${POSTGRES_PASSWORD:-stockwatch_secure_password}@postgres:5432/${POSTGRES_DB:-stockwatch}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WORKER_SIMULATE_FAILURE: ${WORKER_SIMULATE_FAILURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - stockwatch-network

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    image: stockwatch-frontend:local
    container_name: stockwatch-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stockwatch-network

volumes:
  postgres_data:
    name: stockwatch_postgres_data
  redis_data:
    name: stockwatch_redis_data

networks:
  stockwatch-network:
    name: stockwatch-network
    driver: bridge
