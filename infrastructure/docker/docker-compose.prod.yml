services:
  postgres:
    image: postgres:16-alpine
    container_name: stockwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stockwatch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: stockwatch-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - stockwatch-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY_OWNER:-pranavamrutkar9}/stockwatch-backend:${IMAGE_TAG:-latest}
    container_name: stockwatch-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stockwatch-network

  worker:
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY_OWNER:-pranavamrutkar9}/stockwatch-worker:${IMAGE_TAG:-latest}
    container_name: stockwatch-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WORKER_SIMULATE_FAILURE: ${WORKER_SIMULATE_FAILURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - stockwatch-network

  frontend:
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY_OWNER:-pranavamrutkar9}/stockwatch-frontend:${IMAGE_TAG:-latest}
    container_name: stockwatch-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stockwatch-network

volumes:
  postgres_data:
    name: stockwatch_postgres_data
  redis_data:
    name: stockwatch_redis_data

networks:
  stockwatch-network:
    name: stockwatch-network
    driver: bridge
